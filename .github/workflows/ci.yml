name: CI Security Pipeline
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit pytest
      - name: SAST - Bandit (static code analysis)
        run: |
          bandit -r . -x ./tests -ll -f txt -o bandit-report.txt || true
          cat bandit-report.txt || true
      - name: SCA - pip-audit (dependency vulnerabilities)
        run: |
          pip-audit -r requirements.txt --no-deps -f columns -o pip-audit-report.txt || true
          cat pip-audit-report.txt || true
      - name: Run tests
        env:
          JWT_SECRET: ci-test-secret-string-at-least-32-bytes-long
        run: python -m pytest -q
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.txt
            pip-audit-report.txt
